name: kamao
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.7
  get: ^4.6.6
  dio: ^5.10.0
  flutter_secure_storage: ^9.2.4
  requests_inspector: ^5.2.2
  flutter_native_splash: ^2.4.7
  font_awesome_flutter: ^10.9.1
  remixicon: ^4.9.3
