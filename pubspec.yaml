name: kamao
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.7
  get: ^4.6.6
  dio: ^5.10.0
  flutter_secure_storage: ^9.2.4
  requests_inspector: ^5.2.2
  flutter_native_splash: ^2.4.7
  font_awesome_flutter: ^10.9.1
  remixicon: ^4.9.3
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  app_links: ^6.3.2
  intl: ^0.19.0
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  flutter_web_auth_2: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3


flutter:
  assets:
    - assets/images/onboarding/
    - assets/images/home/
    - assets/images/app_logo.png

  uses-material-design: true
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"

# Native launch screen: solid brand color only (no logo).
# Android 12+ always shows a brief OS splash — keep it blank green so the
# Flutter SplashView is the only branded splash the user sees.
flutter_native_splash:
  color: "#F7FBEE"
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#F7FBEE"
    # Solid brand square (same as bg) — hides the default launcher icon
    # without showing a second logo before SplashView.
    image: assets/images/splash_blank.png
    icon_background_color: "#F7FBEE"
